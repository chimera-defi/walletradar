name: Wallets Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '**/*.md'
      - 'scripts/sync_table_scores.js'
      - 'scripts/refresh-card-tier-matrix.js'
      - 'amplify.yml'
      - '.github/workflows/wallets-frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '**/*.md'
      - 'scripts/sync_table_scores.js'
      - 'scripts/refresh-card-tier-matrix.js'
      - 'amplify.yml'
      - '.github/workflows/wallets-frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: wallets-frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  data-integrity:
    name: Data Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify score/table sync is clean
        run: node scripts/sync_table_scores.js

      - name: Verify card tier matrix structure
        run: node scripts/refresh-card-tier-matrix.js --offline

  build:
    name: Build & Regression
    runs-on: ubuntu-latest
    needs: data-integrity
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Verify OG images exist
        run: |
          echo "Checking if required OG images exist..."

          required_images=(
            "og-image.png"
            "og-software-wallets-table.png"
            "og-hardware-wallets-table.png"
            "og-crypto-cards-table.png"
            "og-ramps-table.png"
            "og-software-wallets-details.png"
            "og-hardware-wallets-details.png"
            "og-crypto-cards-details.png"
            "og-ramps-details.png"
            "og-explore.png"
          )

          missing=0
          for img in "${required_images[@]}"; do
            if [ ! -f "public/$img" ]; then
              echo "Missing: public/$img"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo "Missing required OG images. Run: cd frontend && bun run generate-og"
            exit 1
          fi

          echo "All required OG images are present."

      - name: Build
        run: bun run build

      - name: Validate Twitter cards
        run: bun run validate-cards

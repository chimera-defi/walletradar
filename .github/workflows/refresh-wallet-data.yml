# Wallet Data Refresh Workflow
#
# This workflow automatically refreshes wallet activity data from GitHub
# and creates a PR with the updated information.
#
# Schedule: Every Monday at 9:00 AM UTC
# Manual: Can also be triggered manually via workflow_dispatch

name: Refresh Wallet Data

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not create PR)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      
      - name: Create data directory
        run: mkdir -p data
      
      - name: Run refresh script - Software Wallets (Markdown report, job summary only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/refresh-github-data.sh
          scripts/refresh-github-data.sh --markdown > "$RUNNER_TEMP/activity-status.md"
          echo "Generated software wallet activity status report"
      
      - name: Run refresh script - Software Wallets (JSON)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/refresh-github-data.sh --json > data/activity.json
          echo "Generated software wallet JSON data file"
      
      - name: Run refresh script - Hardware Wallets (Markdown report, job summary only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/refresh-hardware-wallet-data.sh
          scripts/refresh-hardware-wallet-data.sh --markdown > "$RUNNER_TEMP/hardware-activity-status.md"
          echo "Generated hardware wallet activity status report"
      
      - name: Run refresh script - Hardware Wallets (JSON)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/refresh-hardware-wallet-data.sh --json > data/hardware-activity.json
          echo "Generated hardware wallet JSON data file"
      
      - name: Check for changes
        id: check_changes
        run: |
          git add data/activity.json data/hardware-activity.json
          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --cached --stat
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): refresh activity data\n\nCo-authored-by: Chimera <chimera_defi@protonmail.com>"
          title: "[Auto] Refresh Wallet Activity Data"
          body: |
            **Agent:** GitHub Actions (automated, no model)

            **Co-authored-by:** Chimera <chimera_defi@protonmail.com>

            ## Summary
            Automated wallet activity refresh from the latest GitHub data.

            ## Original Request
            > Scheduled weekly refresh (refresh-wallet-data.yml).

            ## Changes Made
            
            **Software Wallets:**
            - Updated `data/activity.json` with machine-readable data (the Markdown reports are in the workflow run summary, not committed)
            
            **Hardware Wallets:**
            - Updated `data/hardware-activity.json` with machine-readable data (the Markdown reports are in the workflow run summary, not committed)
            
            ## Testing & Verification
            - [ ] Verify activity statuses are accurate
            - [ ] Check for any newly inactive wallets
            
            ---
            *Generated automatically by GitHub Actions on ${{ github.event.repository.updated_at }}*
          branch: auto/refresh-wallet-data
          delete-branch: true
          labels: |
            automated
            data-refresh
      
      - name: Summary
        if: always()
        run: |
          echo "## Wallet Activity Refresh Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Software Wallets" >> $GITHUB_STEP_SUMMARY
          if [ -f "$RUNNER_TEMP/activity-status.md" ]; then
            cat "$RUNNER_TEMP/activity-status.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No software wallet activity file generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Hardware Wallets" >> $GITHUB_STEP_SUMMARY
          if [ -f "$RUNNER_TEMP/hardware-activity-status.md" ]; then
            cat "$RUNNER_TEMP/hardware-activity-status.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No hardware wallet activity file generated" >> $GITHUB_STEP_SUMMARY
          fi
